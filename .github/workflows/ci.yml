name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27.2"

      - name: Verify Swift version
        run: |
          xcodebuild -version
          /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift --version
          /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift --version | grep -E 'Swift version 6\.4\.2([[:space:]]|$)'

      - name: Run tests
        run: /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift test

      - name: Build release for both architectures
        run: |
          /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift build -c release --arch arm64 --product swol
          /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift build -c release --arch x86_64 --product swol
