name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Set up Swift 6.4.2
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.2"

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -E 'Swift version 6\.4\.2([[:space:]]|$)'

      - name: Run tests
        run: swift test

      - name: Build release for both architectures
        run: |
          swift build -c release --arch arm64 --product swol
          swift build -c release --arch x86_64 --product swol
