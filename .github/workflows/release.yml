name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Set up Swift 6.4.2
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: "6.4.2"

      - name: Verify Swift version
        run: |
          swift --version
          swift --version | grep -E 'Swift version 6\.4\.2([[:space:]]|$)'

      - name: Run tests
        run: swift test

      - name: Import Code Signing Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p actions "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p actions "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db" login.keychain-db
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k actions \
            "$RUNNER_TEMP/build.keychain-db"

      - name: Build arm64
        run: swift build -c release --arch arm64 --product swol

      - name: Save arm64 binary
        run: cp "$(swift build -c release --arch arm64 --show-bin-path)/swol" swol-arm64

      - name: Build x86_64
        run: swift build -c release --arch x86_64 --product swol

      - name: Save x86_64 binary
        run: cp "$(swift build -c release --arch x86_64 --show-bin-path)/swol" swol-x86_64

      - name: Create Universal Binary
        run: lipo -create -output swol swol-arm64 swol-x86_64

      - name: Verify Universal Binary
        run: lipo -info swol

      - name: Sign Binary
        run: |
          codesign --force \
            --timestamp \
            --options runtime \
            --sign "Developer ID Application: Redseven AB (4MW6K9N3NR)" \
            swol

      - name: Verify Signature
        run: codesign --verify --strict --verbose=4 swol

      - name: Prepare Binary
        run: |
          mkdir -p dist
          cp swol dist/

      - name: Zip Binary
        run: |
          cd dist
          zip -r swol-macos.zip swol

      - name: Notarize Binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/swol-macos.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/swol-macos.zip

      - name: Clean up signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
