name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "27.2"

      - name: Verify Swift version
        run: |
          xcodebuild -version
          /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift --version
          /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift --version | grep -E 'Swift version 6\.4\.2([[:space:]]|$)'

      - name: Run tests
        run: /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift test

      - name: Import Code Signing Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          : "${BUILD_CERTIFICATE_BASE64:?Missing BUILD_CERTIFICATE_BASE64 secret}"
          : "${P12_PASSWORD:?Missing P12_PASSWORD secret}"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/certificate.p12"' EXIT
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$RUNNER_TEMP/build.keychain-db"

      - name: Build arm64
        run: /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift build -c release --arch arm64 --product swol

      - name: Save arm64 binary
        run: cp "$(/usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift build -c release --arch arm64 --show-bin-path)/swol" swol-arm64

      - name: Build x86_64
        run: /usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift build -c release --arch x86_64 --product swol

      - name: Save x86_64 binary
        run: cp "$(/usr/bin/xcrun --toolchain XcodeDefault --sdk macosx swift build -c release --arch x86_64 --show-bin-path)/swol" swol-x86_64

      - name: Create Universal Binary
        run: lipo -create -output swol swol-arm64 swol-x86_64

      - name: Verify Universal Binary
        run: lipo -verify_arch arm64 x86_64 swol

      - name: Sign Binary
        run: |
          codesign --force \
            --keychain "$RUNNER_TEMP/build.keychain-db" \
            --timestamp \
            --options runtime \
            --sign "Developer ID Application: Redseven AB (4MW6K9N3NR)" \
            swol

      - name: Verify Signature
        run: codesign --verify --strict --verbose=4 swol

      - name: Prepare Binary
        run: |
          mkdir -p dist
          cp swol dist/

      - name: Zip Binary
        run: |
          cd dist
          zip -r swol-macos.zip swol
          shasum -a 256 swol-macos.zip > swol-macos.zip.sha256

      - name: Notarize Binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/swol-macos.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 15m --output-format json > "$RUNNER_TEMP/swol-notarization.json"
          python3 - "$RUNNER_TEMP/swol-notarization.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as report:
              result = json.load(report)
          print("Notarization:", result.get("id"), result.get("status"))
          if result.get("status") != "Accepted":
              raise SystemExit("Notarization was not accepted; release stopped.")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: true
          files: |
            dist/swol-macos.zip
            dist/swol-macos.zip.sha256

      - name: Clean up signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
