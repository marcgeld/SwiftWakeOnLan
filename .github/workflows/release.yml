name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Release
        run: swift build -c release

      - name: Prepare Binary
        run: |
          mkdir dist
          cp .build/release/swol dist/

      - name: Zip Binary
        run: |
          cd dist
          zip -r swol-macos.zip swol

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/swol-macos.zip
